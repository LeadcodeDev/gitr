[package]
name = "gitr_gui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "A desktop Git client built on gpui. Run `gitr` in a checkout to open it."
keywords = ["git", "gui", "desktop", "vcs", "gpui"]
categories = ["development-tools", "gui"]

[[bin]]
name = "gitr"
path = "src/main.rs"

[dependencies]
ui.workspace = true
domain.workspace = true
gpui.workspace = true
gpui_platform.workspace = true
gpui-component.workspace = true
gpui-component-assets.workspace = true
anyhow.workspace = true
async-channel = "2"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

[dev-dependencies]
tempfile = "3"

[lints]
workspace = true
