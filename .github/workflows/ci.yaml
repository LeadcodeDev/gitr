name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: rustfmt
      - run: cargo fmt --all --check

  core:
    name: domain, graph and vcs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p gitr-domain -p gitr-graph -p gitr-vcs --all-targets -- -D warnings
      - run: cargo test -p gitr-domain -p gitr-graph -p gitr-vcs

  app:
    name: ui and gitr
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.97.1
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      # Not `cargo build`: a build alone compiles neither the test targets nor the
      # integration tests, so it stays green through breakage that only those see —
      # which is exactly how the package rename shipped red.
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
